# Some notes here, because there's a LOT to keep track of:
# SG = H&K
# Signature = SIG Sauer
# Simmons Armory = Springfield Armory
# Izhma = Kalashnikov Concern and subsidiaries
# Bernetti = Beretta
# Reinbeck = Remington
# Mosconi = Mossberg
# Ferino = Franchi
# Rapture = Winchester
# IMI = IWI
# FTI = Metal Storm
# Czech = CZ
# UN = FN Herstal
# Stefano = Steyr (hate this name)
# J&M = S&W
# Chimano = Glock
# Tarius = Taurus
# Marcom = Milkor
# Lakner = Walther
# Thanatos = Barrett
# Arctic Impact = Accuracy International
# Ketchnov = TsKIB
# Lion = KelTec
# Magdrop = Magpul
# Giovanni = Benelli
# Bergentrückung = B&T
# HIC = Cobray
# Crosskill = Colt but they just kinda show up in random places, so eh

# Other companies are used if they show up on the gun, regardless of whether that makes real-world sense
# (e.g. the Five Seven has Acuto written on it, despite being made by FN Herstal irl)

