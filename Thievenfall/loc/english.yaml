# Gameplay Hints
loading_gameplay_1: "Failing heists may have consequences."
loading_gameplay_2: "Running dry? Consider bringing ammo bags to keep the party going, or try making more efficient use of both of your weapons."
loading_gameplay_4: "Gage packages will grant an XP bonus for each package collected, regardless of whether the Gage Mod Courier DLC is owned."
loading_gameplay_8: "On most heists masking up will trigger the alarm. Staying unmasked can allow you to complete some objectives, but eventually you will need to fight."
loading_gameplay_10: "You get extra money for each surviving crew member."
loading_gameplay_11: "Low detection helps with making progress during stealth, but can also help you in combat with the correct skills."
loading_gameplay_12: "Cloakers have learned restraint, but some of them will do anything to stop you - even if it involves ending their own lives."
loading_gameplay_13: "Medics stand out in a crowd and will drain your ammo if left unchecked."
loading_gameplay_14: "Shields come in various flavours. Marshal shields can blind you, and Winters' shields have extra health."
loading_gameplay_15: "ZEAL will stop at nothing to stop you, and will even work with GenSec if necessary."
loading_gameplay_16: "Tasers will stun you so that nearby enemies can take you down. If you are stunned for too long you will be incapacitated."
loading_gameplay_17: "Snipers can be located by their lasers and tracer rounds."
loading_gameplay_19: "Perk decks have had their effects moved to skill trees."
loading_gameplay_20: "The 'Medic' subtree aims to keep the crew alive."
loading_gameplay_21: "The 'Marksman' subtree rewards hitting your shots with semi-auto weapons."
loading_gameplay_22: "The 'Controller' subtree helps keep hostages in check."
loading_gameplay_23: "The 'Ammo Specialist' subtree keeps the crew's weapons loaded."
loading_gameplay_24: "The 'Mercenary' subtree lets you dish it out."
loading_gameplay_25: "The 'Muscle' subtree lets you stay in the fight for extended periods of time."
loading_gameplay_26: "The 'Engineer' subtree grants your sentries superior area denial."
loading_gameplay_27: "The 'Gunsmith' subtree gives your weapons powerful bonuses."
loading_gameplay_28: "The 'Breacher' subtree improves the reliability of drills."
loading_gameplay_29: "The 'Infiltrator' subtree increases your stealth potential."
loading_gameplay_30: "The 'Hitman' subtree rewards concealment."
loading_gameplay_31: "The 'Agent' subtree enhances your mobility."
loading_gameplay_32: "The 'Substance Abuser' subtree boosts the power of consumables."
loading_gameplay_33: "The 'Brawler' subtree allows your melee weapons to kill bulldozers."
loading_gameplay_34: "The 'Revenant' subtree helps you get back on your feet."
loading_gameplay_35: "Don't be afraid to leave bags alone - cops don't tamper with evidence."
loading_gameplay_37: "Making effective use of both your weapons is necessary to survive. Don't forget to switch weapons if needed!"
loading_gameplay_38: "Saws can drastically speed up objectives or grant access to additional loot, if you have the skill points for it."
loading_gameplay_40: "Cloakers won't try to cuff you if you're the last one standing."
loading_gameplay_41: "Cops are more easily intimidated if you are behind them and they are alone."
loading_gameplay_42: "Headshots deal double damage."
loading_gameplay_45: "Being incapacitated by a taser might not take away your health, but it will drain your remaining down time."
loading_gameplay_46: "Snipers hurt - they can take out all your armor in a single shot, or if your armor is broken, instantly down you."
loading_gameplay_51: "Just because a camera can't see you now doesn't mean it won't see you in a few seconds. Keep your eye on which direction they're facing!"
loading_gameplay_53: "Cops aren't easily afraid - you can always take them as hostages between assaults, but need the 'Dominator' skill to take hostages during an assault."
loading_gameplay_55: "Doctor bags restore 10 seconds of down time per charge. First aid kits only restore health, but can restore down time with the 'Amphetamine' skill (Mastermind)."
loading_gameplay_57: "If you are taken into custody you will remain in custody at the start of the next heist."
loading_gameplay_58: "First aid kits are better than doctor bags if you haven't been down yet or just need a quick pick-me-up."
loading_gameplay_60: "Sticking together increases your chances of survival. Split up at your own risk."
loading_gameplay_61: "You cannot stun a bulldozer. Do not even try."
loading_gameplay_62: "Cloakers are resistant to damage. Headshots are the key."
loading_gameplay_63: "Cloakers are immune to ECM feedback."
loading_gameplay_65: "Some heists are able to be completed in stealth. One heist can even be completed unmasked!"
loading_gameplay_72: "Ballistic vests are affected by suppression, while the higher tier armors are not."
loading_gameplay_76: "Bulldozers do not shower. Beware their scent."
loading_gameplay_77: "Sensor mines mark anyone that walk through them and benefit from any marking skills you have. Try combining them with 'High Value Target'!"
loading_gameplay_78: "Keep an eye on your objectives!"
loading_gameplay_81: "Medics will fully heal any non-special that you try to kill near them. Prioritise them to avoid wasting ammo!"
loading_gameplay_82: "Flashbangs will detonate quicker on higher difficulties."
loading_gameplay_85: "ECM feedback can stun enemies within a wide area."
loading_gameplay_87: "Most stealthable heists have a camera operator. Taking him out will massively increase your chance of success."
loading_gameplay_88: "Upgrading your safehouse will increase the value of loot."
loading_gameplay_89: "ECM jammers will block phone calls, but won't block cameras without the 'Appliance Breach' skill. If you haven't taken out the cameras, this could spell disaster!"
loading_gameplay_92: "On higher difficulties snipers will disable their lasers. Be very careful when stepping out of cover!"
loading_gameplay_96: "Captain Winters' presence massively boosts the number of cops. Deal with him quickly to avoid being overrun!"
loading_gameplay_97: "Captain Winters will retreat when his shield wall is dead, but you can also kill Winters himself to prevent him from appearing again."
loading_gameplay_98: "Cable ties are now infinite."
loading_gameplay_106: "Leaving loot at potential secure points can be a good way to quickly finish a heist, if you just want to escape as soon as possible."
loading_gameplay_110: "ECM feedback requires a skill to activate, and can only be used once without the second level."
loading_gameplay_111: "Melee has been overhauled into its own weapon class. If you need to quickly hit something, try using Quick Melee instead!"
loading_gameplay_114: "The SWAT turret's weak point is the circular camera under the gun. It can only be shot after the shield is fully destroyed."
loading_gameplay_116: "On some heists you can board up windows to block entrances or gain some additional cover."
loading_gameplay_133: "Having hostages will delay the start of the next assault by up to 30 seconds. The longer the heist has been going, the more hostages you need - but never more than six."

# Heister Tips
loading_heister_1: "As the late Almir once said, 'keep those helmets flying'! He then punched me in the face."
loading_heister_3: "Subscribe to Nebula+ for discounts on future DLC and access to a new microtransaction store!"
loading_heister_5: "If you do not succeed on Hell's Island, Bain will die."
loading_heister_7: "Trophies are a good source of C-Stacks, if you can unlock them, that is..."
loading_heister_9: "It is important that you get downed crew mates back up as soon as possible. Every second counts!"
loading_heister_11: "Don't have a crosshair? Use a laser!"
loading_heister_12: "Some mutators have been turned into default features. Be careful around cloakers!"
loading_heister_13: "I bite my elbows - I am a bad motherfucker."
loading_heister_15: "Friendly fire is enabled by default. The damage scales with difficulty, up to full damage on Death Sentence."
loading_heister_16: "Offshore can be used to unlock new skill sets or infamy. Choose wisely!"
loading_heister_18: "New to Thievenfall? Join the Discord server to ask for help!"
loading_heister_19: "Skills can synergise in interesting ways. Take time to read their effects and experiment."
loading_heister_20: "The difficulty will gradually increase as you progress through the campaign. After completing the campaign, all heists will be played on Death Sentence."
loading_heister_22: "Weapon mods need to first be unlocked, but remain available indefinitely."
loading_heister_23: "Perks are now skills."
loading_heister_24: "A good crew will have a diverse set of deployables, with each heister specialising in a specific one."
loading_heister_26: "Consumable perk decks are now unlocked every 20th level, with the exception of Stoic which is unlocked through Convict's 'Substance Abuser' subtree."
loading_heister_33: "Reloading with at least one bullet left will give you an extra bullet in the chamber, though be careful not to reload too early - ammo left in the magazine is lost forever."
loading_heister_34: "After finishing the main campaign you can continue playing randomly generated campaigns."
loading_heister_37: "If there's a ghost next to the day indicator then the heist is stealthable. If there isn't then it can only be completed loud."
loading_heister_39: "Stealthable Elephant heists offer greater rewards for completing them quietly."
loading_heister_40: "Vlad's jobs are unpredictable."
loading_heister_44: "Heavy units wear body armor. Aim for the head, bring armor piercing weapons, or use appropriate skills to counter them."
loading_heister_46: "There are many types of bulldozer: green and black pack shotguns, medicdozers heal nearby cops, and skulldozers carry LMGs."
loading_heister_49: "Your weapons are less accurate while moving, and more accurate while crouching and aiming down sights."
loading_heister_52: "The core gameplay changes very little on higher difficulties, but your margin for error does."

# Trivia
loading_trivia_2: "Jimmy owns a theme park. It was closed due to an active shooter (it was Jimmy)."
loading_trivia_3: "Jimmy is the head of a very successful corporation."
loading_trivia_4: "Jimmy claims that if he saw a block of cocaine he would ignore it. He's lying."
loading_trivia_5: "THAT WAS FUCKING LOUD!"
loading_trivia_6: "Jimmy."
loading_trivia_7: "Jacket is very unlikely to be the real Jacket. The arcade machine in his room supports this, implying Hotline Miami never happened and he is merely a fan of the game."
loading_trivia_8: "Jacket's position in the crew is questionable as he doesn't seem to care about money, rather craving violence."
loading_trivia_9: "Jacket's Piece never appeared in Hotline Miami, and only appears as his signature weapon in PAYDAY."
loading_trivia_10: "Do you like hurting other people? Who are leaving messages on your answering machine? Where are you right now? Why are we having this conversation?"
loading_trivia_11: "Tony was confirmed by OVERKILL in 2017 to be a copycat instead of the real Tony Montana."
loading_trivia_12: "The Scarface Character Pack was delisted in 2020, making it the first piece of licensed content to be removed from the game."
loading_trivia_13: "The contents of Tony's injector are unconfirmed, but it's most likely to be morphine, adrenaline, or both."
loading_trivia_15: "Hoxton still has nightmares about his time in prison."
loading_trivia_16: "Hoxton is very unique. He's both a fugitive AND a crook."
loading_trivia_17: "Hoxton loves to repeat his own name like a Pokémon."
loading_trivia_18: "Hoxton realised he was gay while in prison. He does not know how to tell the rest of the crew this."
loading_trivia_20: "Sydney's hair is naturally blue."
loading_trivia_23: "John Wick and Chains served in the military together. They question whether Captain Winters actually served."
loading_trivia_25: "John Wick was removed from the game in 2024. He is no longer accessible to new players."
loading_trivia_27: "Bain once recorded a guide. He won't tell anyone what it's about, though."
loading_trivia_28: "Bain is a master vaper. He never goes anywhere without his vape."
loading_trivia_29: "Bain still uses a fax machine."
loading_trivia_30: "Bain is out of touch and out of time. He's out of his head when you're not around."
loading_trivia_31: "Dallas often requests a medic bag, even though it's actually called a doctor bag."
loading_trivia_32: "Dallas is the only member of the original crew to not have his voice actor changed across all three mainline games."
loading_trivia_33: "Dallas was originally going to become a contractor and be replaced by a new Dallas, voiced by Eric Etebari."
loading_trivia_34: "Dallas doesn't like going to the proctologist."
loading_trivia_35: "Prior to December 2025, almost all of Wolf's lines were reused from PAYDAY: The Heist. Only his masking up and pager lines were new."
loading_trivia_36: "Wolf once had to GTFO from a den of wolves. That has nothing to do with his name, though."
loading_trivia_37: "Wolf once willingly spent an extended period of time in a psych ward. He's still crazy though."
loading_trivia_38: "Wolf once committed a massacre in a nightclub."
loading_trivia_39: "Bodhi complains about Nintendo but bought a Switch 2 on launch day."
loading_trivia_40: "Bodhi hates corporations and would gladly crash his car into an Amazon warehouse. Hoxton keeps daring him to do it."
loading_trivia_41: "Bodhi wants to fight. Who wants to fight?"
loading_trivia_42: "Bodhi's mother named him after Bodhi's Pool Repair, her favourite local plumbing company."
loading_trivia_43: "Damion Poitier was originally cast as Thanos in Marvel's Cinematic Universe."
loading_trivia_44: "Chains often talks in third person."
loading_trivia_45: "Chains was killed between PAYDAY: The Heist and PAYDAY 2. The current Chains is not who he claims he is."
loading_trivia_46: "Chains was killed between PAYDAY 2 and PAYDAY 3. The current Chains is not who he claims he is."
loading_trivia_47: "Clover claims to be Irish despite being born and raised in England."
loading_trivia_48: "Clover claims to have several late siblings. The exact number varies based on who she's talking to."
loading_trivia_49: "Clover is incredibly unlucky. Everything she tries goes wrong in a cartoonishly fucked up way."
loading_trivia_50: "Clover claims to be a horror fan. She has only watched Scary Movie 2."
loading_trivia_51: "Houston is openly gay. He thinks Hoxton may be closeted, but isn't 100% sure."
loading_trivia_52: "Houston refuses to drink alcohol out of fear that he may post something racist online and get cancelled on X (formerly Twitter)."
loading_trivia_53: "Houston occasionally plays Roblox. The rest of the crew mocks him for this."
loading_trivia_54: "Despite having enough money to buy any car he wants, Houston still drives around in a Honda Civic."
loading_trivia_55: "Bonnie sleeps in a dog bed."
loading_trivia_56: "Bonnie constantly leaves a dehumidifier running in the safe house, despite Dallas' asthma."
loading_trivia_57: "Bonnie occasionally cries herself to sleep, and then asks the crew if they heard her crying the next morning."
loading_trivia_58: "Bonnie is a crippling alcoholic, and refuses to seek help for her drinking problem."
loading_trivia_59: "Captain Winters is part of GenSec's elite force, being brought in to help take down the clowns on Mayhem and above."
loading_trivia_60: "He might seem invincible, but Captain Winters is just as vulnerable to bullets as anyone else."
loading_trivia_61: "Captain Winters doesn't care about how many people die. He just wants to see the clowns behind bars."
loading_trivia_62: "Captain Winters was hired by GenSec for his prior military experience, however he never actually saw service."
loading_trivia_63: "Ron Perlman has famously claimed that he did not care about his role as Rust and simply did it for the money."
loading_trivia_64: "Rust occasionally posts videos online talking about the corrupt elite."
loading_trivia_71: "Jiro worked his way up the Osaka yakuza before being betrayed due to an affair with the boss's daughter."
loading_trivia_72: "Jiro was imprisoned for 20 years after being betrayed. Upon being released, he single-handedly wiped out the Osaka yakuza while trying to find his son, Kento."
loading_trivia_73: "Jiro came to D.C. because Bain was the one man capable of helping him find his son."
loading_trivia_74: "In-game, Jiro only has a single line that is spoken in English. The rest of his lines are all in Japanese."
loading_trivia_75: "Dragan once stole a car to make sure no civilians would get away. The car belonged to none other than Jerry Seinfeld."
loading_trivia_76: "Fresh fish!"
loading_trivia_77: "Dragan's actor once took part in a real bank robbery. He was later caught and sentenced to 3 years in prison."
loading_trivia_79: "Aldstone's voice actor, John Cleese, was planned to play Hitler in RAID: World War 2. He was only informed of his role right before filming was scheduled, and he refused to do it."
loading_trivia_80: "Aldstone is a descendant of Control, a character introduced in RAID: World War 2. Both characters are portrayed by John Cleese."
loading_trivia_83: "Gage is infertile."
loading_trivia_84: "Gage could walk if he really wanted to."
loading_trivia_85: "Gage served in Afghanistan. He believes Captain Winters is lying about his service."
loading_trivia_86: "FIFTEEN"
loading_trivia_87: "Bob McKendrick is out of control."
loading_trivia_88: "Internet lolcow Chris Chan was once convinced that Bob McKendrick is a real person."
loading_trivia_92: "Jiro has a katana. Try using it while playing as him!"
loading_trivia_93: "Bodhi hates tasers. Try killing one with a weapon that deals at least 100 base damage!"
loading_trivia_94: "Many, MANY goats were harmed during the making of the Goat Simulator heist. Call PETA. We dare you."
loading_trivia_95: "Hector is the one that moved the Mayan gold from OVERDRILL. Seems like a standout guy, really..."
loading_trivia_96: "The event heists are not part of the main campaign, but can be randomly chosen in the post-game."
loading_trivia_97: "The Dentist is an immortal eldritch being that can destroy planets."
loading_trivia_98: "The classic heists returned from PAYDAY: The Heist, but due to gameplay changes they do not play the same. Try the original game if you haven't!"
loading_trivia_99: "He's a hacker, not a planner dammit."

