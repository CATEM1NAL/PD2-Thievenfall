## Mastermind
menu_tea_time_beta_desc: "$lv1;Place doctor bags and first aid kits ##50%## faster."

menu_fast_learner_beta_desc: "$lv1;Crewmates that you revive take ##50%## less damage for ##5## seconds.\n\n$lv2;Damage reduction is increased to ##100%##."

menu_revive_reduction_desc: "$lv1;Gain ##50%## damage reduction while reviving a crewmate.\n\n$lv2;Damage reduction persists for ##5## seconds after reviving."

menu_reviver_bonus_heal: "Transfusion"
menu_reviver_bonus_heal_desc: "$lv1;Crewmates that you revive have ##50%## more health.\n\n$lv2;Crewmates that you revive have ##100%## more health."

menu_fak_capacity: "Walking Pharmacy"
menu_fak_capacity_desc: "$lv1;You can hold ##7## first aid kits.\n\n$lv2;You can hold ##10## first aid kits."

menu_uppers_desc: "$lv1;Your first aid kits are automatically used if a crewmate would have gone down within ##5m## of one."

menu_code_blue: "Code Blue"
menu_code_blue_desc: "$lv1;You revive crewmates ##100%## faster."

menu_docbag_quantity: "Field Surgeon"
menu_docbag_quantity_desc: "$lv1;Carry ##1## extra doctor bag.\n\n$lv2;Carry ##2## extra doctor bags."

menu_docbag_capacity: "Blood Bank"
menu_docbag_capacity_desc: "$lv1;Your doctor bags have ##1## extra charge.\n\n$lv2;Your doctor bags have ##2## extra charges."

menu_healing_damage_reduction: "Triage"
menu_healing_damage_reduction_desc: "$lv1;Crewmates that use your doctor bags or first aid kits gain ##10%## damage reduction for ##2 minutes##."

menu_inspire_beta_desc: "$lv1;Shouting at crewmates increases their movement and reload speeds by ##20%## for ##10## seconds.\n\n$lv2;Shouting at downed crewmates has a ##50%## chance to revive them."

menu_fak_lives: "Amphetamine"
menu_fak_lives_desc: "$lv1;You restore ##5## seconds of down time when using a first aid kit.\n\n$lv2;You restore ##10## seconds of down time when using a first aid kit."

menu_cable_guy: "Cable Guy"
menu_cable_guy_desc: "$lv1;You tie up civilians ##75%## faster.\n\n$lv2;The crew gains ##0.5## damage absorption per hostage, up to ##8## hostages. This does not stack."

menu_deep_throat: "Deep Throat"
menu_deep_throat_desc: "$lv1;Your shout range is increased by ##50%##.\n\n$lv2;Your shout range is increased by ##100%##."

menu_joker_beta_desc: "$lv1;You can convert a dominated cop to fight for you.\n\n$lv2;Your conversion speed is ##50%## faster and you can now have ##2## converted cops fighting for you at once."

menu_joker_damage: "Punisher"
menu_joker_damage_desc: "THIS SKILL REQUIRES ##JOKER##!\n\n$lv1;Your converts deal ##50%## more damage.\n\n$lv2;Your converts deal ##100%## more damage."

menu_joker_dr: "Kevlar"
menu_joker_dr_desc: "THIS SKILL REQUIRES ##JOKER##!\n\n$lv1;Your converts take ##50%## less damage.\n\n$lv2;Your converts take ##99%## less damage."

menu_control_freak_beta_desc: "THIS SKILL REQUIRES ##JOKER##!\n\n$lv1;Your movement speed is increased by ##10%## while you have a convert.\n\n$lv2;Your max health is increased by ##50## while you have a convert."

menu_stockholm_syndrome_beta_desc: "$lv1;Civilians that you tie up won't flee after being freed. Once per heist, you can be traded from custody during an assault."

menu_crowd_control: "Crowd Control"
menu_crowd_control_desc: "$lv1;Civilians within ##10m## of you remain intimidated at all times.\n\n$lv2;Civilians are intimidated by noise that you make."

menu_mobile: "Mobile"
menu_mobile_desc: "$lv1;Move at full speed while aiming down sights."

menu_target_acquisition: "Target Acquisition"
menu_target_acquisition_desc: "$lv1;Aim down sights ##100%## faster.\n\n$lv2;Zoom while aiming down sights is increased by ##25%##."

menu_single_shot_ammo_return_beta_desc: "$lv1;While using a single-fire weapon, landing ##3## headshots within ##6## seconds will return ##1## bullet to your magazine.\n\n$lv2;Only ##2## headshots are required."

menu_speedy_reload_beta_desc: "$lv1;Headshot kills with single-fire weapons increase your reload speed by ##100%## for ##4## seconds."

menu_sniper_graze_damage_desc: "$lv1;Headshots with a sniper rifle deal ##50%## damage to all enemies within ##1m## of the bullet's trajectory.\n\n$lv2;Damage is now ##100%##, but the radius is reduced to ##50cm##."

menu_long_shot: "Long Shot"
menu_long_shot_desc: "$lv1;Marked enemies further than ##10m## away take ##50%## more damage."

## Enforcer
menu_underdog_beta_desc: "$lv1;Deal ##15%## more damage while three enemies are within ##18m## of you."

menu_overdog: "Overdog"
menu_overdog_desc: "$lv1;Take ##10%## less damage while three enemies are within ##18m## of you."

menu_shotgun_impact_beta_desc: "$lv1;Shotguns deal ##10%## more damage.\n\n$lv2;Shotguns deal ##25%## more damage."

menu_shotgun_stability_desc: "$lv1;Stability with shotguns increased by ##8##."

menu_shotgun_cqb_beta_desc: "$lv1;Reload shotguns ##15%## faster.\n\n$lv2;Reload shotguns ##35%## faster."

menu_shotgun_ads_speed_desc: "$lv1;Aim down sights with shotguns ##125%## faster."

menu_close_by_beta_desc: "$lv1;Hipfire shotguns while sprinting."

menu_shotgun_rof: "Slamfire"
menu_shotgun_rof_desc: "$lv1;Rate of fire with single-fire shotguns is increased by ##35%## when hipfiring."

menu_shotgun_accuracy: "Skeet Shooting"
menu_shotgun_accuracy_desc: "$lv1;Shotgun accuracy is increased by ##40%## while aiming down sights."

menu_far_away_beta_desc: "$lv1;Shotgun effective range is increased by ##50%## while aiming down sights."

menu_overkill_beta_desc: "$lv1;Kills with shotguns or the OVE9000 saw grant a ##50%## damage bonus for ##5## seconds."

menu_team_armor_regen: "Herd Mentality"
menu_team_armor_regen_desc: "$lv1;Armor recovery speed for the crew is increased by ##25%##. This does not stack."

menu_iron_man_beta_desc: "$lv1;Hitting a shield can cause it to stagger. Meleeing a shield will always cause it to stagger."

menu_nerves_of_steel_name: "Nerves of Steel"
menu_nerves_of_steel_desc: "$lv1;Damage taken is reduced by ##50%## while performing an interaction."

menu_show_of_force_beta_desc: "$lv1;Armor of the three ballistic vests is increased by ##20##."

menu_pack_mule_beta: "Catapult"
menu_pack_mule_beta_desc: "$lv1;Bag throwing distance is increased by ##50%##."

menu_armor_bag_reduction: "Beast of Burden"
menu_armor_bag_reduction_desc: "$lv1;Bag movement penalty is reduced by ##1%## for every ##10## points of armor.\n\n$lv2;The bag movement penalty does not affect you."

menu_oppressor_beta_desc: "$lv1;Your armor recovers ##15%## faster."

menu_stun_resistance: "Stun Resistance"
menu_stun_resistance_desc: "$lv1;Recover from flashbangs slightly faster.\n\n$lv2;Recover from flashbangs significantly faster."

menu_bulletproof_name: "Bulletproof"

menu_juggernaut_beta_desc: "$lv1;Unlocks the ##Advanced Tactical Vest##."

menu_extra_ammo_box: "Double Dip"
menu_extra_ammo_box_desc: "$lv1;Every 6th enemy killed drops an extra ammo box."

menu_scavenger_desc: "$lv1;Ammo pickup range is increased by ##50%##."

menu_portable_saw_desc: "$lv1;Unlock the ##primary## OVE9000 saw.\n\n$lv2;Unlock the ##secondary## OVE9000 saw."

menu_carbon_blade: "Carbon Blade"
menu_carbon_blade_desc: "$lv1;OVE9000 saw is ##40%## more efficient against locks.\n\n$lv2;OVE9000 saw is ##80%## more efficient against enemies and penetrates body armor.\n\n$lv3;OVE9000 saw penetrates shields and has a ##50%## chance on kill to cause panic within ##10m##."

menu_ammo_reservoir_beta_desc: "$lv1;Your ammo bags grant infinite ammo for up to ##10## seconds after use, based on how much ammo you restored.\n\n$lv2;Infinite ammo can last up to ##20## seconds."

menu_stockpile_name: "Deep Pockets"
menu_stockpile_desc: "$lv1;Carry ##1## extra ammo bag.\n\n$lv2;Carry ##2## extra ammo bags."

menu_ammobag_capacity: "Stockpile"
menu_ammobag_capacity_desc: "$lv1;Your ammo bags hold ##100%## more ammo.\n\n$lv2;Your ammo bags hold ##200%## more ammo."

menu_fully_loaded_desc: "$lv1;Ammo pickup is increased by ##25%##.\n\n$lv2;Ammo pickup is increased by ##50%##."

menu_scrounger_name: "Scrounger"
menu_scrounger_desc: "$lv1;Picking up an ammo box reduces your grenade recharge time by ##1## second.\n\n$lv2;Time reduction is now ##2## seconds per ammo box."

menu_max_ammo_inc: "Big Game Hunter"
menu_max_ammo_inc_desc: "$lv1;Ammo capacity increased by ##25%##."

menu_spotter_teamwork_beta_desc: "$lv1;Special enemies that you aim at are marked.\n\n$lv2;Enemies that you mark take ##25%## more damage."

## Technician
menu_toolkit: "Toolkit"
menu_toolkit_desc: "$lv1;You repair broken drills and saws ##25%## faster."

menu_silent_drilling: "Silent Drilling"
menu_silent_drilling_desc: "$lv1;Guards will only move to investigate drills or saws that you placed or upgraded within ##9m##.\n\n$lv2;Guards will not move to investigate drills or saws that you placed or upgraded."

menu_drill_restart: "Repair System"
menu_drill_restart_desc: "$lv1;Drills or saws that you placed or upgraded have a ##50%## chance to automatically restart ##5## to ##15## seconds after breaking.\n\n$lv2;Drills or saws that you placed or upgraded will always restart ##5## to ##15## seconds after breaking."

menu_drill_expert_beta_desc: "$lv1;Drills or saws that you placed or upgraded finish ##15%## faster.\n\n$lv2;Drills or saws that you placed or upgraded finish ##30%## faster."

menu_trip_mine_damage: "Fragmentation"
menu_trip_mine_damage_desc: "$lv1;Your trip mines deal enough damage to kill ##heavies## and ##cloakers##.\n\n$lv2;Your trip mines deal enough damage to kill ##Winters shields##."

menu_trip_mine_radius: "Demolition Man"
menu_trip_mine_radius_desc: "$lv1;Your trip mine explosions are ##50%## bigger.\n\n$lv2;Trip mine explosions are ##100%## bigger."

menu_trip_mine_quantity: "McCallister"
menu_trip_mine_quantity_desc: "$lv1;You can hold ##7## trip mines.\n\n$lv2;You can hold ##14## trip mines."

menu_kick_starter_beta_desc: "$lv1;Meleeing a broken drill or saw will restart it."

menu_sensor_mines: "Sensor Mines"
menu_sensor_mines_desc: "$lv1;You can interact with trip mines to switch them to sensor mode, allowing them to automatically mark anyone that walks through them."

menu_shaped_charge: "Shaped Charge"
menu_shaped_charge_desc: "$lv1;In addition to trip mines, you gain ##4## shaped charges which can be used to open safes or doors.\n\n$lv2;You now have ##8## shaped charges.\n\n$lv3;You now have ##12## shaped charges."

menu_fire_trap_beta_desc: "$lv1;Upon detonation trip mines create ##4m## of fire for ##10## seconds.\n\n$lv2;Fire now reaches ##6m## and lasts ##20## seconds."

menu_heavy_impact_beta_desc: "$lv1;Bullets have a ##10%## chance to stagger enemies (does not apply to Captain Winters).\n\n$lv2;Chance increased to ##20%##."

menu_fire_control_beta_desc: "$lv1;Hipfire accuracy increased by ##12##."

menu_shock_and_awe_beta_desc: "$lv1;Killing ##3## enemies with a full-auto weapon will increase your reload speed by up to ##100%##. This bonus is reduced by ##4%## for each bullet above ##5## currently in your magazine, and is lost if you change weapon."

menu_body_expertise_beta_desc: "$lv1;Body shots apply ##50%## of the headshot damage bonus.\n\n$lv2;Body shots apply ##100%## of the headshot damage bonus."

menu_sprint_shoot: "Close By"
menu_sprint_shoot_desc: "$lv1;You can hipfire while sprinting."

menu_hollow_point: "Black Tip"
menu_hollow_point_desc: "$lv1;Bullets have a ##50%## chance to ignore body armor.\n\n$lv2;Bullets will always ignore body armor."

menu_sentry_shield: "Plating"
menu_sentry_shield_desc: "$lv1;Sentries gain a frontal shield, protecting them from damage."

menu_eco_sentry_beta_desc: "$lv1;Sentries have ##150%## more health."

menu_sentry_ammo: "Ammo Reserve"
menu_sentry_ammo_desc: "$lv1;Sentries have ##100%## more ammo.\n\n$lv2;Sentries have ##200%## more ammo."

menu_sentry_accuracy: "Precision Engineering"
menu_sentry_accuracy_desc: "$lv1;Sentries are ##100%## more accurate."

menu_sentry_rotation: "Servo Grease"
menu_sentry_rotation_desc: "$lv1;Sentries rotate ##150%## faster."

menu_sentry_ap: "Armor Penetration"
menu_sentry_ap_desc: "$lv1;Sentries can toggle AP rounds, lowering fire rate by ##75%## but increasing damage by ##250%## and piercing enemies/shields."

menu_jack_of_all_trades_beta_desc: "$lv1;You can equip a second deployable. Your second deployable has the quantity halved."

menu_tower_defense_beta_desc: "$lv1;Carry ##1## extra sentry gun.\n\n$lv2;Carry ##3## extra sentry guns."

## Ghost
menu_scavenger_beta_desc: "$lv1;Movement speed is increased by ##30%## for ##5## seconds on armor break.\n\n$lv2;Also applies to the crew when triggered."

menu_dire_need_beta_desc: "$lv1;Your first shot on an enemy inflicts stagger while your armor is broken.\n\n$lv2;Effect lasts for ##6## seconds after armor recovers."

menu_moving_target_desc: "$lv1;You can sprint while strafing.\n\n$lv2;You can sprint in any direction."

menu_sprinter: "Sprinter"
menu_sprinter_desc: "$lv1;Sprint speed increased by ##25%##.\n\n$lv2;Dodge is increased by ##10## while sprinting."

menu_move_speed: "Endurance"
menu_move_speed_desc: "$lv1;Move ##25%## faster while walking and ##10%## faster while crouching.\n\n$lv2;Sprint speed increased by ##25%##. Dodge increased by ##10## while sprinting.\n\n$lv3;Movement speed increased by ##10%##."

menu_sprint_loaded: "Sprint Loaded"
menu_sprint_loaded_desc: "$lv1;You can reload while sprinting."

menu_hidden_blade: "Hidden Blade"
menu_hidden_blade_desc: "$lv1;Melee weapon concealment increased by ##2##."

menu_vest_conceal: "Hidden Vest"
menu_vest_conceal_desc: "$lv1;Ballistic vest concealment increased by ##4##."

menu_insulation_beta_desc: "$lv1;Being tased no longer forces you to shoot.\n\n$lv2;You have a ##30%## chance every second to break free from a taser.\n\n$lv3;Interacting with a taser allows you to break free."

menu_jail_diet_beta_desc: "$lv1;Gain ##1## dodge (up to ##10##) for each ##3## points of detection risk below ##35##.\n\n$lv2;Dodge is now granted for each point of detection risk below ##35##."

menu_optic_illusions_desc: "$lv1;Your target rate is reduced by ##33%##.\n\n$lv2;Your target rate is reduced by ##50%##."

menu_silence_expert_beta_desc: "$lv1;Stability with silenced weapons increased by ##8##.\n\n$lv2;Accuracy with silenced weapons increased by ##12##."

menu_silence_conceal: "Pocket Silencer"
menu_silence_conceal_desc: "$lv1;Silencers gain ##1## concealment and their concealment penalty is reduced by ##2##."

menu_backstab_beta_desc: "$lv1;Gain ##3%## crit chance (up to ##30%##) for each ##3## points of detection risk below ##35##.\n\n$lv2;Crit chance is now granted for each point of detection risk below ##35##."

menu_inside_man: "Inside Man"
menu_inside_man_desc: "$lv1;You can buy additional assets.\n\n$lv2;You can buy all assets."

menu_chameleon_beta_desc: "$lv1;In stealth, standing still for ##3.5s## will automatically mark everyone within ##10m##."

menu_cam_loop: "Secure Loop"
menu_cam_loop_desc: "$lv1;You can interact with a single camera to disable it for ##7.5## seconds.\n\n$lv2;Duration is extended to ##15## seconds.\n\n$lv3;You can disable cameras from ##50%## further away."

menu_lockpick_speed: "Dexterity"
menu_lockpick_speed_desc: "$lv1;Your lockpicking speed is doubled.\n\n$lv2;You can lockpick non-Titan safes."

menu_cleaner_beta_desc: "$lv1;Your body bag capacity is increased by ##1##.\n\n$lv2;Carry ##1## extra body bag case."

menu_ecm_feedback: "Feedback"
menu_ecm_feedback_desc: "$lv1;You can interact with placed ECMs to enable feedback for ##15## seconds, potentially stunning all cops within ##100m##.\n\n$lv2;ECMs will recharge over ##4## minutes."

menu_ecm_duration: "Lithium-ion"
menu_ecm_duration_desc: "$lv1;Your ECM effects last ##25%## longer.\n\n$lv2;Your ECM effects last ##50%## longer."

menu_ecm_booster_beta: "Appliance Breach"
menu_ecm_overdrive_desc: "$lv1;Your ECMs block cameras.\n\n$lv2;Your ECMs block pagers.\n\n$lv3;You can use ECMs to open security doors."

menu_ecm_quantity: "Cyber Warfare"
menu_ecm_quantity_desc: "$lv1;Carry ##1## extra ECM.\n\n$lv2;Carry ##3## extra ECMs."

## Fugitive
menu_quick_draw: "Quick Draw"
menu_quick_draw_desc: "$lv1;Weapon switch speed is ##33%## faster with pistols."

menu_akimbo_skill_beta_desc: "$lv1;Akimbo stability penalty reduced by ##8##.\n\n$lv2;Akimbo stability penalty reduced by ##16##.\n\n$lv3;Akimbo stability penalty reduced by ##24##."

menu_expert_handling_desc: "$lv1;Successful pistol hits grant a stacking ##10%## accuracy bonus (##50%## max) for ##3## seconds."

menu_bleedout_timer_skill: "More Blood To Bleed"
menu_bleedout_timer_skill_desc: "$lv1;Max bleedout time increased by ##10## seconds.\n\n$lv2;Max bleedout time increased by ##20## seconds.\n\n$lv3;Max bleedout time increased by ##30## seconds."

menu_revive_swap_speed: "Revive Swap Speed"
menu_revive_swap_speed_desc: "$lv1;Switch weapons ##100%## faster for ##10## seconds after being revived.\n\n$lv2;Reload ##100%## faster for 10 seconds after being revived."

menu_running_from_death_beta_desc: "$lv1;Move ##30%## faster for ##10## seconds after being revived."

menu_perseverance_beta_desc: "$lv1;You keep standing for ##3## seconds after going down, but your movement speed is decreased by ##60%##.\n\n$lv2;You keep standing for ##6## seconds."

menu_vengeful_swan: "Vengeful Swan"
menu_vengeful_swan_desc: "THIS SKILL REQUIRES ##SWAN SONG##!\n\n$lv1;You have infinite ammo while ##Swan Song## is active."

menu_feign_death_desc: "$lv1;You have a ##50%## chance to self-revive. Self-reviving decreases your down timer by ##10## seconds.\n\n$lv2;Chance is increased to ##100%##."

menu_pistol_beta_messiah_desc: "$lv1;You can self-revive after getting a kill while down. This can only happen once.\n\n$lv2;You can self-revive again after using a doctor bag."

menu_coup_de_grace: "Coup de Grâce"
menu_coup_de_grace_desc: "$lv1;The final bullet in your magazine deals triple damage."

menu_trigger_happy_beta_desc: "$lv1;Damage is doubled for ##2## seconds after landing a pistol shot.\n\n$lv2;Damage bonus lasts ##5## seconds."

menu_because_of_training: "Because Of Training"
menu_because_of_training_desc: "$lv1;Incoming melee damage is reduced by ##50%##.\n\n$lv2;Charging your melee allows you to block incoming melee attacks."

menu_steroids_beta_desc: "$lv1;Deal ##100%## more melee damage against non-special enemies.\n\n$lv2;Bonus damage also applies to specials."

menu_bloodthirst_desc: "$lv1;Weapon kills increase your melee damage by ##100%##, up to ##1000%##. Damage resets on melee kill."

menu_melee_reload_speed: "Mag Steal"
menu_melee_reload_speed_desc: "$lv1;Reload speed is ##100%## faster for ##3## seconds after a melee kill."

menu_drop_soap_beta_desc: "$lv1;Charging your melee allows you to block cloaker kicks."

menu_wolverine_beta_desc: "$lv1;While below ##50%## health your melee/saw damage scales with health lost, up to ##250%## more damage. Healing is disabled while this skill is active."

menu_gunserker: "Gunserker"
menu_gunserker_desc: "$lv1;While below ##50%## health your weapon damage scales with health lost, up to ##100%## more damage. Healing is disabled while this skill is active."

menu_frenzy_desc: "$lv1;Gain ##25%## damage reduction, but your health and healing are capped at ##25%##.\n\n$lv2;Damage reduction is increased to ##50%## and health is capped at ##1%##."

## Perk Decks
menu_perk_dmg: "$lv1;Weapon damage increased by ##10%##.\n\n$lv2;Weapon damage increased by ##25%##."
menu_perk_headshot: "$lv1;Headshot damage multiplier increased by ##50%##.\n\n$lv2;Headshot damage multiplier increased by ##100%##."

menu_deck2_1_skill: "$lv1;Max health increased by ##25##.\n\n$lv2;Max health increased by ##50##.\n\n$lv3;Max health increased by ##75##.\n\n$lv4;Max health increased by ##100##.\nRestore ##1## health every ##5## seconds."

menu_deck2_7_skill: "$lv1;Suppressed enemies can panic. Your target rate is increased by ##15%##.\n\n$lv2;Kills within ##10m## have a ##50%## chance to cause panic."

menu_armorer_skill: "Impact Plate"
menu_armorer_skill_desc: "$lv1;Armor increased by ##25%##.\n\n$lv2;Armor increased by ##50%##.\n\n$lv3;Armor increased by ##75%##.\n\n$lv4;Armor increased by ##100%##. Armor recovery is ##50%## less effective and locked at ##50%## slower, but occurs even while in combat."

menu_yakuza_speed: "Adrenaline"
menu_yakuza_speed_desc: "$lv1;While below ##50%## health your armor recovery speed scales with health lost, to a maximum of ##60%##.\n\n$lv2;Movement speed also increases by up to ##20%## with health lost."

menu_deck4_5_skill: "$lv1;Dodge increased by ##25##.\n\n$lv2;Dodge increased by ##50##.\n\n$lv3;Dodge increased by ##75##.\n\n$lv4;Dodging a bullet damages the enemy that fired it."

menu_rogue_switch: "$lv1;Weapon switch speed is increased by ##80%##.\n\n$lv2;Weapon switch speed is increased by ##160%##.\n\n$lv3;Weapon switch speed is increased by ##320%##."

menu_hitman_skill_desc: "$lv1;Armor recovers ##15%## faster.\n\n$lv2;Armor recovers ##30%## faster.\n\n$lv3;Armor recovers ##45%## faster.\n\n$lv4;Your armor will always recover after a maximum of ##3## seconds, even while taking damage.\n"

menu_break_skill: "$lv1;While you have armor, store ##4## health per crew kill that is consumed on armor recovery.\n\n$lv2;Store ##8## health per crew kill.\n\n$lv3;Store ##12## health per crew kill."

menu_crook_skill: "Composure"
menu_crook_skill_desc: "$lv1;Ballistic vests have their armor increased by ##40%## and their dodge increased by ##5##.\n\n$lv2;Armor is now increased by ##80%## and dodge is increased by ##10##.\n\n$lv3;Armor is increased further to ##120%## and dodge is increased by ##15##."

menu_burglar_stealth: "$lv1;Bag corpses ##20%## faster.\n\n$lv2;Answer pagers ##10%## faster.\n\n$lv3;Pick locks ##20%## faster."

menu_infil_melee: "Psychopath"
menu_infil_melee_desc: "$lv1;Every successful melee hit within ##5## seconds of a previous hit will deal an additional ##50%## damage, up to a total of ##1000%##.\n\n$lv2;Damage bonus is increased to ##100%##, but the activation window is reduced to ##3## seconds."
menu_infil_close_desc: "$lv1;Gain ##8%## damage reduction while an enemy within ##10m## is targeting you.\n\n$lv2;Damage reduction is now ##16%##.\n\n$lv3;Damage reduction is now ##24%##."
menu_infil_heal_desc: "$lv1;Heal ##20%## of your max health when dealing melee damage. This can only occur once every ##10## seconds.\n\n$lv2;Heal ##10%## of your max health on melee kill."

menu_deck14_1_skill: "$lv1;The crew gains ##0.5## damage absorption (up to ##8##) for every ##30## damage you deal, resetting every ##2## seconds. If multiple people have this skill, the highest absorption is used.\n\n$lv2;Damage required is now ##20##, and the max absorption is increased to ##12##.\n\n$lv3;Any damage absorption you apply to yourself is doubled."

menu_anarch_rise: "$lv1;Armor is increased by ##20##, but health is reduced by ##25##.\n\n$lv2;Armor is increased by ##40##, but health is reduced by ##50##.\n\n$lv3;Armor is increased by ##60##, but health is reduced by ##75##."

menu_mag_throw: "Mag Throw"
menu_mag_throw_desc: "$lv1;Picking up ammo triggers an ammo pickup for the rest of the crew."

menu_gambler_heal: "$lv1;Picking up ammo can heal you for up to ##2## health. The crew heals for up to ##1## health.\n\n$lv2;Ammo can heal you for up to ##4## health, and the crew for ##2## health.\n\n$lv3;Ammo can heal you for up to ##6## health, and the crew for ##3## health."

menu_kingpin_priority: "INJECTOR UNLOCKS AT LEVEL 60!\n\n$lv1;Your target rate is increased by ##1000%## while the ##Injector## is active."
menu_kingpin_cooldown: "INJECTOR UNLOCKS AT LEVEL 60!\n\n$lv1;Cooldown of the ##Injector## is reduced by ##1## second for every ##50## health restored while at max health."
menu_kingpin_healing: "INJECTOR UNLOCKS AT LEVEL 60!\n\n$lv1;While the ##Injector## is active and you are below half health, healing is increased by ##25%##."
menu_kingpin_base: "INJECTOR UNLOCKS AT LEVEL 60!\n\n$lv1;Base healing of the ##Injector## increased to ##50%##.\n\n$lv2;Healing is further increased to ##75%##."

menu_stoic_skill: "$lv1;Unlocks the ##Stoic's Hip Flask##. All damage taken is now applied quickly over ##6## seconds. Using the flask negates any remaining damage with a ##10## second cooldown.\n\n$lv2;Cooldown is reduced by ##1## second per kill when health is below ##100%##."
menu_stoic_negation: "$lv1;Remaining damage from ##Virtue## is negated after not taking damage for ##1.5## seconds."
menu_stoic_regen: "$lv1;Your armor is converted into health.\n\n$lv2;##50%## of negated damage from ##Virtue## is turned into healing."

menu_h3h3_cooldown: "GAS DISPENSER UNLOCKS AT LEVEL 80!\n\n$lv1;Kills from you or your ##Gas Dispenser## target decrease the cooldown by ##1## second."
menu_h3h3_absorb: "GAS DISPENSER UNLOCKS AT LEVEL 80!\n\n$lv1;Kills from you or your ##Gas Dispenser## target grant ##0.4## absorption (max ##12##) while the Gas Dispenser is active. Absorption is reset when the cooldown expires."

menu_leech_swan: "LEECH AMPULE UNLOCKS AT LEVEL 100!\n\n$lv1;Running out of health while the ##Leech Ampule## is active allows you to keep fighting with ##80%## reduced movement speed.\n\n$lv2;The ##Leech Ampule## can be used while down to get back up temporarily. Using a ##doctor bag## or reviving a crewmate allows you to stay up if you have health when the effect ends."
menu_leech_duration: "LEECH AMPULE UNLOCKS AT LEVEL 100!\n\n$lv1;Cooldown of the ##Leech Ampule## is reduced by ##1## second per kill.\n\n$lv2;Effect of the ##Leech Ampule## now lasts ##10## seconds."
menu_leech_healing: "LEECH AMPULE UNLOCKS AT LEVEL 100!\n\n$lv1;Crewmates recover ##10## health when you take damage while the ##Leech Ampule## is active.\n\n$lv2;You recover ##40%## of your health when activating the ##Leech Ampule##."
menu_leech_segments: "LEECH AMPULE UNLOCKS AT LEVEL 100!\n\n$lv1;Activating the ##Leech Ampule## divides your health into ##10## segments, instead of ##5##."

menu_tac_reload: "Tactical Reload"
menu_tac_reload_desc: "$lv1;Your unequipped weapon is reloaded after ##10## kills.\n\n$lv2;Weapon switch speed is increased by ##480%## for ##3## seconds after reload is triggered."

## Outcast
# Removed skills
menu_oldholm_syndrome: "Helsinki Syndrome"
menu_oldholm_syndrome_desc: "$lv1;Untied civilians may revive you when shouting at them.\n\n$lv2;Potentially receive an ammo pickup when revived by a civilian."

menu_tough_guy: "Tough Guy"
menu_tough_guy_desc: "$lv1;Screen shake from damage reduced by ##50%##."

menu_hip_accuracy: "From The Hip"
menu_hip_accuracy_desc: "$lv1;Hipfire spread reduced by ##50%##."

menu_mag_plus: "Mag Plus"
menu_mag_plus_desc: "$lv1;Magazine capacity increased by ##50%## for all weapons.\n\n$lv2;Magazine capacity increased by ##100%## for all weapons."

menu_smg_rof: "SMG Specialist"
menu_smg_rof_desc: "$lv1;Fire rate with SMGs increased by ##20%##."

menu_custody_timer: "Master Trader"
menu_custody_timer_desc: "$lv1;Custody timer reduced by ##50%##."

menu_crouch_dodge: "Duck and Cover"
menu_crouch_dodge_desc: "$lv1;Gain ##5## dodge while crouching.\n\n$lv2;Gain ##15## dodge while crouching."

menu_dominator: "Dominator"
menu_dominator_desc: "$lv1;Your intimidation against cops is ##100%## more effective.\n\n$lv2;You can intimidate cops during assaults."

menu_oppressor_name: "Oppressor"
menu_oppressor_desc: "$lv1;Threat is increased by ##10%##.\n\n$lv2;Threat is increased by ##20%##.\n\n$lv3;Threat is increased by ##50%##."

menu_downed_ads: "Last Stand"
menu_downed_ads_desc: "$lv1;You can use your primary weapon while down.\n\n$lv2;You can ADS while down."

menu_shinobi: "Shinobi"
menu_shinobi_desc: "$lv1;Walk ##25%## faster and move ##10%## faster while crouched."

menu_drop_cloth: "Drop Cloth"
menu_drop_cloth_desc: "$lv1;Enemy death alert radius reduced by ##95%##."

menu_daredevil: "Thrill Seeker"
menu_daredevil_desc: "$lv1;Ladder climbing speed increased by ##20%##.\n\n$lv2;Ladder climbing speed increased by ##75%##."

# Weapon skills
menu_ar_stability: "Barrel Alignment"
menu_ar_stability_desc: "$lv1;Accuracy increased by ##8## for all weapons.\n\n$lv2;Accuracy bonus is increased to ##16##."

menu_stable_shot_beta_desc: "$lv1;Accuracy increased by ##16## while stationary."

menu_lmg_stability: "Heat Shield"
menu_lmg_stability_desc: "$lv1;Stability increased by ##8## for all weapons.\n\n$lv2;Stability bonus is increased to ##16##."

menu_single_shot_acc: "Barrel Crown"
menu_single_shot_acc_desc: "$lv1;Single fire weapons have their spread reduced by ##20%##."

menu_reload_speed: "Magazine Funnel"
menu_reload_speed_desc: "$lv1;All weapons reload ##25%## faster.\n\n$lv2;Reload speed is now ##50%## faster.\n\n$lv3;Reload speed is now ##100%## faster."

menu_tinkerer: "Tinkerer"
menu_tinkerer_desc: "$lv1;Weapons with attachments gain a ##10%## stability bonus.\n\n$lv2;Weapons with attachments gain a ##10%## accuracy bonus.\n\n$lv3;Weapons with attachments gain a ##25%## damage bonus."

menu_illegal_parts: "Illegal Parts"
menu_illegal_parts_desc: "$lv1;All weapons gain a ##50%## bonus to their fire rate.\n\n$lv2;Fire rate is now increased by ##100%##."

menu_silencer_statboost: "Chamber Vent"
menu_silencer_statboost_desc: "$lv1;Silenced weapons gain ##50%## more stability.\n\n$lv2;Silenced weapons gain ##50%## more accuracy."

# Unused skills
menu_blanks: "Warning Shot"
menu_blanks_desc: "$lv1;The first time you shoot a civilian they won't die."

menu_loud_and_proud: "Loud And Proud"
menu_loud_and_proud_desc: "$lv1;Deal an additional ##5%## damage for each ##7## points of detection risk above ##40##, up to ##25%## extra damage.\n\n$lv2;Damage is increased to ##10%## per ##7## points, for a total of ##50%## extra damage."

menu_pager_snatch: "Pager Snatch"
menu_pager_snatch_desc: "$lv1;Killing a guard with melee has a ##25%## chance to not set off their pager.\n\n$lv2;Melee kills now have a ##50%## chance of ignoring pagers.\n\n$lv3;Melee kills now have a ##75%## chance of ignoring pagers.\n\n$lv4;Melee kills will never trigger pagers."

menu_sharp_damage: "Vicious Warrior"
menu_sharp_damage_desc: "$lv1;Damage and knockdown of ##sharp## melee weapons increased by ##100%##.\n\n$lv2;Damage and knockdown of ##sharp## melee weapons increased by ##200%##.\n\n$lv3;Damage and knockdown of ##sharp## melee weapons increased by ##300%##."

menu_shell_dimension: "Feeling Lucky"
menu_shell_dimension_desc: "$lv1;Bullets have a ##10%## chance to not be consumed when fired.\n\n$lv2;Chance is increased to ##25%##."

menu_hypocritical: "Hypocritical"
menu_hypocritical_desc: "$lv1;Crit chance increased by ##10%##.\n\n$lv2;Crit chance increased by ##20%##."

menu_nebula_plus: "Nebula Plus"
menu_nebula_plus_desc: "$lv1;Asset cost reduced by ##10%##.\n\n$lv2;Asset cost reduced by ##25%##.\n\n$lv3;Asset cost reduced by ##50%##."

