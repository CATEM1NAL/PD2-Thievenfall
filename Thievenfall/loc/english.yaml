# Throwables
bm_wpn_prj_ace_desc: "When they said to always have an ace up your sleeve, I don't think this is what they meant..."
bm_grenade_fir_com_desc: "Every historical case of spontaneous combustion can be chalked up to a time travelling heister hitting someone with one of these."
bm_grenade_frag_desc: "For when you really need to clear a room, and fast."
bm_grenade_frag_com_desc: "Lower power but bigger boom."
bm_concussion_desc: "Stuns all enemies in range for several seconds.\n\nBREACH AND CLEAR!"
bm_grenade_poison_gas_grenade_desc: "Emits a poisonous cloud that dissipates after 15 seconds.\n\nThere is no context in which using this thing could be justified..."
bm_grenade_molotov_desc: "Creates a flaming pool at the point of impact that burns for 15 seconds.\n\nCheap and effective, just don't drink from the wrong bottle."
bm_dynamite_desc: "Did you know that dynamite is remarkably stable? It won't detonate upon being shot, but it will still remove your legs all the same."
bm_grenade_sticky_grenade_desc: "Sticks to surfaces, but takes longer to detonate.\n\nI heard this was first used by some black ops guys who went above and beyond the call of duty."
bm_grenade_electric: "Pig Tickler"
bm_grenade_electric_desc: "Stuns all enemies in range for several seconds.\n\nJiu Feng said this was a prototype and he'd like to take it to mass market. There's no way these will catch on, right?"

# Perk Consumables
bm_ability_chico_injector_desc: "Press the throwable key to activate. While active, 25% of all damage taken is converted into healing. This effect lasts 6 seconds."
bm_grenade_smoke_screen_grenade_desc: "Grants +50 dodge to all crewmates standing inside the cloud, and decreases enemy accuracy by 50% if they enter it. Lasts 10 seconds."
bm_grenade_tag_team_desc: "Press the throwable key while looking at an ally to activate. When you or the tagged ally get a kill, you restore 2 health and the tagged ally restores 1. This effect lasts 12 seconds, but is extended by 1 second per kill."
bm_grenade_pocket_ecm_jammer_desc: "Press the throwable key to activate. During stealth this will jam phone calls for 6 seconds. In loud it will instead activate feedback, potentially stunning enemies within 10m.\n\nECM skills also apply to the Pocket ECM."
bm_grenade_copr_ability_desc: "Press the throwable key to activate for 6 seconds. While active your armor is disabled and your health is divided into 5 segments. Taking damage removes a segment (two if the damage is higher than 200), while killing 2 enemies restores 1 segment. All kills block damage for 1 second."
bm_grenade_damage_control_desc: "Press the throwable key to negate stacked damage."

